allprojects {
    group = 'com.yonsei119'
    version = '2.1.0'

    repositories {
        mavenCentral()
    }
}
/*
 * [Gradle 문법] allprojects { ... }, repositories { ... } (모노레포 전체 공통 설정 블록)
 * [Gradle 내장 속성/함수]
 * - group, version : 빌드 산출물(JAR)의 소속 패키지와 버전 지정 (내장 속성명 변경 불가)
 * - mavenCentral() : 전 세계 공용 Java 오픈소스 창고에서 라이브러리를 내려받는 내장 함수
 *                    (형제 저장소 함수: google(), gradlePluginPortal(), mavenLocal())
 * [내가 지은 이름] 'com.yonsei119' (패키지 도메인), '2.1.0' (프로젝트 릴리스 버전)
 * [핵심 원리 & 비유] 프랜차이즈 본사에서 모든 지점(하위 모듈)이 공통으로 쓸 식자재 납품처(Maven Central)와 간판 버전을 지정하는 규칙임.
 */

tasks.register('bootRun') {
    group = 'application'
    description = 'Runs the Spring Boot backend application (:backend:bootRun).'
    dependsOn(':backend:bootRun')
}
/*
 * [Gradle 내장 도구/함수] tasks.register('...') (새 빌드 작업 등록 / 형제 함수: tasks.named('...'), tasks.withType(...))
 * [Gradle 내장 함수] dependsOn(':backend:bootRun') (하위 모듈의 bootRun 작업을 대신 실행하도록 위임)
 * [내가 지은 이름] 'bootRun' (루트 폴더에서도 ./gradlew bootRun 한 줄로 서버를 켤 수 있게 만든 단축 스위치 이름)
 */

tasks.register('bootJar') {
    group = 'build'
    description = 'Assembles an executable jar archive containing both backend and frontend (:backend:bootJar).'
    dependsOn(':backend:bootJar')
}
/*
 * [Gradle 내장 함수] tasks.register('bootJar'), dependsOn(':backend:bootJar')
 * [내가 지은 이름] 'bootJar' (루트에서 ./gradlew bootJar 실행 시 프론트엔드+백엔드 통합 JAR를 굽는 단축 스위치)
 * [최종 산출물 경로 예시]
 *   ./gradlew bootJar
 *   └──> backend/build/libs/yonsei119-backend.jar (이 파일 하나로 어디서든 서버 실행 가능)
 */

tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs all backend JUnit 5 automated verification tests (:backend:test).'
    dependsOn(':backend:test')
}
/*
 * [Gradle 내장 함수] tasks.register('checkAll'), dependsOn(':backend:test')
 * [내가 지은 이름] 'checkAll' (루트 경로에서 전체 자동화 검증 테스트를 한 번에 수행하는 단축 작업명)
 */
