allprojects {
    group = 'com.yonsei119'
    version = '3.0.0'

    repositories {
        mavenCentral()
    }
}
/*
 * [Gradle 내장 블록 및 속성]
 * - allprojects { ... } : 루트와 모든 하위 모듈에 공통 설정을 넣는 내장 블록임.
 * - 형제 블록 : 하위 모듈만 고르는 subprojects { ... }가 있음.
 * - group, version : 빌드 산출물의 그룹 ID와 버전을 정하는 내장 속성임.
 * - repositories { ... } : 외부 라이브러리를 내려받을 저장소를 선언하는 블록임.
 * - mavenCentral() : Maven Central 공개 저장소를 등록하는 내장 함수임.
 * - 형제 저장소 : google(), gradlePluginPortal(), mavenLocal() 등이 있음.
 *
 * [프로젝트 그룹 및 버전]
 * - 'com.yonsei119' : 프로젝트의 Maven 그룹 ID이자 자바 기본 패키지 이름임.
 * - '3.0.0' : Java 27 및 Spring Boot 4.2 업그레이드 릴리스 버전 문자열임.
 *
 * [동작 흐름]
 * - 루트 build.gradle 평가 -> allprojects 실행 -> 루트와 ':backend'가 공통 설정 상속함.
 *   └── 두 모듈 모두 동일한 group, version, Maven Central 저장소를 씀.
 */

tasks.register('bootRun') {
    group = 'application'
    description = 'Runs the Spring Boot backend application (:backend:bootRun).'
    dependsOn(':backend:bootRun')
}
/*
 * [Gradle 내장 함수 및 속성]
 * - tasks.register('이름') { ... } : 실제 쓸 때만 태스크를 준비하는 지연 등록 함수임.
 * - 형제 메서드 : 이미 등록된 태스크를 고치는 tasks.named('...')가 있음.
 * - group, description : './gradlew tasks' 목록에 표시할 분류와 설명 속성임.
 * - dependsOn('...') : 현재 태스크 전에 먼저 실행할 태스크를 연결하는 함수임.
 * - 형제 순서 제어 : 실행 순서만 정하는 mustRunAfter(...) 등이 있음.
 *
 * [빌드 태스크명]
 * - 'bootRun' : 루트에서 ':backend:bootRun'을 대신 실행하도록 만든 단축 태스크임.
 *
 * [동작 흐름]
 * - 루트 bootRun 호출 -> dependsOn으로 ':backend:bootRun' 실행함.
 *   └── application.yml의 server.port(${PORT:8080})로 내장 Tomcat 서버가 열림.
 *
 * [실행 방법]
 * - Windows : .\gradlew.bat bootRun (또는 .\gradlew.bat :backend:bootRun)
 * - Linux/macOS : ./gradlew bootRun
 * - 기본 접속 주소 : http://localhost:8080
 */

tasks.register('bootJar') {
    group = 'build'
    description = 'Assembles an executable jar archive containing both backend and frontend (:backend:bootJar).'
    dependsOn(':backend:bootJar')
}
/*
 * [Gradle 내장 함수 및 속성]
 * - tasks.register('이름') { ... } : 실행 시점에 맞춰 태스크를 지연 등록하는 내장 함수임.
 * - group = 'build' : 빌드 태스크 그룹으로 분류하는 내장 속성임.
 * - description, dependsOn('...') : 태스크 설명과 선행 태스크를 연결하는 내장 API임.
 *
 * [빌드 태스크명]
 * - 'bootJar' : 루트에서 ':backend:bootJar'를 대신 실행하는 단축 태스크임.
 *
 * [동작 흐름]
 * - 루트 bootJar 실행 -> ':backend:bootJar' 호출 -> 통합 실행 JAR 생성함.
 *   ├── 산출물 경로 : backend/build/libs/yonsei119.jar
 *   └── 내부 구성 : frontend/ 정적 파일 + 백엔드 클래스 + 의존 라이브러리.
 *
 * [실행 방법]
 * - 빌드 : .\gradlew.bat bootJar (Linux/macOS는 ./gradlew bootJar)
 * - 실행 : java -jar backend/build/libs/yonsei119.jar
 * - 포트 변경 실행 : java -Dserver.port=9090 -jar backend/build/libs/yonsei119.jar
 */

tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs all backend JUnit 5 automated verification tests (:backend:test).'
    dependsOn(':backend:test')
}
/*
 * [Gradle 내장 함수 및 속성]
 * - tasks.register('이름') { ... } : 검증용 태스크를 지연 등록하는 내장 함수임.
 * - group = 'verification' : 검증 태스크 그룹으로 묶어주는 내장 속성임.
 * - description, dependsOn('...') : 태스크 설명과 선행 테스트 태스크를 잇는 API임.
 * - 형제 검증 태스크 : Gradle 기본 태스크인 check, test가 있음.
 *
 * [빌드 태스크명]
 * - 'checkAll' : 루트에서 ':backend:test' JUnit 5 전체 테스트를 바로 돌리는 단축 태스크임.
 *
 * [동작 흐름]
 * - 루트 checkAll 실행 -> dependsOn으로 ':backend:test' 호출 -> 백엔드 테스트 일괄 수행함.
 *
 * [실행 방법]
 * - Windows : .\gradlew.bat checkAll (또는 .\gradlew.bat :backend:test)
 * - Linux/macOS : ./gradlew checkAll
 */
