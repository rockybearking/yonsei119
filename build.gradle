/*
 * [역할 및 실행 시점]
 * - 역할: 모노레포 루트 폴더에서 바로 서버 실행(`bootRun`), 배포 JAR 생성(`bootJar`), 전체 테스트(`checkAll`)를 호출할 수 있게 연결하는 루트 빌드 스크립트
 * - 실행 시점: Gradle 설정(Configuration) 단계에서 `settings.gradle` 직후 평가됨
 *
 * [전체 태스크 위임 흐름]
 * - 루트 명령 실행
 *   ├── `.\gradlew.bat bootRun`  ──> `:backend:bootRun` 위임 실행 (http://localhost:8080 기동)
 *   ├── `.\gradlew.bat bootJar`  ──> `:backend:bootJar` 위임 실행 (`backend/build/libs/yonsei119.jar` 생성)
 *   └── `.\gradlew.bat checkAll` ──> `:backend:test` 위임 실행 (백엔드 통합 19건 + Playwright E2E 2건 검증)
 */
allprojects {
    group = 'com.yonsei119'
    version = '3.0.0'

    repositories {
        mavenCentral()
    }
}

/** 루트에서 `:backend:bootRun` 내장 Tomcat 개발 서버를 바로 기동하는 단축 태스크 */
tasks.register('bootRun') {
    group = 'application'
    description = 'Runs the Spring Boot backend application (:backend:bootRun).'
    dependsOn(':backend:bootRun')
}

/** 프론트엔드 정적 자산과 백엔드 코드를 하나로 묶은 실행 JAR(`yonsei119.jar`) 빌드 단축 태스크 */
tasks.register('bootJar') {
    group = 'build'
    description = 'Assembles an executable jar archive containing both backend and frontend (:backend:bootJar).'
    dependsOn(':backend:bootJar')
}

/** 백엔드 JUnit 5 통합 테스트와 Chromium 브라우저 E2E 테스트를 일괄 실행하는 검증 단축 태스크 */
tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs all backend JUnit 5 and Playwright E2E automated verification tests (:backend:test).'
    dependsOn(':backend:test')
}
