/*
 * [역할 및 실행 시점]
 * - 역할: Gradle 멀티모듈 프로젝트의 이름과 포함 모듈(`backend`), JDK 27 자동 탐색 플러그인을 선언하는 최상위 설정 파일
 * - 실행 시점: `gradlew` 명령 실행 시 가장 먼저(초기화 단계) 읽힘
 *
 * [전체 빌드 구조 흐름]
 * - settings.gradle 실행
 *   ├── foojay-resolver-convention ──> 로컬에 JDK 27이 없으면 OpenJDK 27을 자동 탐색·연결
 *   ├── rootProject.name = 'yonsei119' ──> 프로젝트 고유 이름 고정
 *   └── include 'backend' ──> `backend/build.gradle`을 하위 모듈(`:backend`)로 등록
 *       (참고: `frontend/`는 별도 Gradle 모듈이 아니라 `:backend:copyFrontendToStatic` 태스크가 정적 리소스로 합침)
 */
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'yonsei119'

include 'backend'
