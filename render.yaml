# ==============================================================================
# [1. 역할 및 실행 시점]
# - 역할 : Render 클라우드 무료 플랜 배포 설계도 (빌드·환경변수·콜드스타트 헬스체크 정의)
# - 실행 시점 : GitHub 저장소 푸시로 Render 자동 배포가 시작될 때 읽힘
#
# [2. 콜드스타트 로딩 제어 흐름 (시퀀스 다이어그램)]
#
#       [User Browser]            [Render Proxy]      [ApiController (/api/health)]
#              |                         |                          |
#              |-- 1. initial visit ---->|                          |  절전 인스턴스 깨우기 시작
#         +----+-------------------------+--------------------------+----------------+
#         | [loop : while initial NEMC cache warming up]                             |  초기 7종 데이터 적재 중
#         |    |                         |-- 2. GET /api/health --->|                |  준비 상태 주기적 폴링
#         |    |                         |<-- 503 WARMING_UP -------|                |  Render 자체 로딩 화면 유지
#         +----+-------------------------+--------------------------+----------------+
#              |                         |-- 3. GET /api/health --->|  초기 캐시 적재 완료 직후
#              |                         |<-- 200 UP (ready=true) --|  트래픽 연결 승인
#              |<-- 4. serve ready map --|                          |  병원 카드 즉시 표시
#              v                         v                          v
#
# [3. 사용된 Render Blueprint 표준 키 및 환경변수]
# - Render 표준 내장 키
#   ㄴ services / type / runtime / plan / region : 웹 서비스 · Docker · Free 플랜 지정
#   ㄴ dockerfilePath                            : 컨테이너 빌드에 사용할 Dockerfile 경로
#   ㄴ healthCheckPath                           : 트래픽 연결 전 준비 상태를 확인할 API 경로 (`/api/health`)
#   ㄴ envVars / sync                            : 런타임 환경변수 주입 (`sync: false`는 대시보드 비밀키 보호)
# - 프로젝트 환경변수 연결처 (`application.yml` -> `Yonsei119Properties`)
#   ㄴ NEMC_CACHE_TTL_SECONDS="60"      : 실시간 병상·공지 캐시 수명 60초
#   ㄴ NEMC_REFRESH_INTERVAL_MS="60000" : 백그라운드 자동 동기화 주기 60초
#   ㄴ NEMC_COLD_CACHE_TTL_SECONDS      : 병원 마스터 정보 캐시 수명 6시간(21,600초)
# ==============================================================================

services:
  - type: web
    name: yonsei119
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
      - key: NEMC_CACHE_TTL_SECONDS
        value: "60"
      - key: NEMC_COLD_CACHE_TTL_SECONDS
        value: "21600"
      - key: NEMC_REFRESH_INTERVAL_MS
        value: "60000"
      - key: NAVER_MAP_CLIENT_ID
        value: "xfbxloc8km"
      - key: NAVER_MAP_CLIENT_SECRET
        sync: false
      - key: NEMC_API_SERVICE_KEY
        sync: false
