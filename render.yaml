services:
  - type: web
    name: yonsei119
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
      - key: NEMC_CACHE_TTL_SECONDS
        value: "180"
      - key: NEMC_COLD_CACHE_TTL_SECONDS
        value: "21600"
      - key: NEMC_REFRESH_INTERVAL_MS
        value: "180000"
      - key: NAVER_MAP_CLIENT_ID
        value: "xfbxloc8km"
      - key: NAVER_MAP_CLIENT_SECRET
        sync: false
      - key: NEMC_API_SERVICE_KEY
        sync: false
# [Render Blueprint 문법] services, type: web, runtime: docker, healthCheckPath, envVars (플랫폼 예약 키, 이름 변경 불가)
# [내가 지은 이름/설정값]
# - name: yonsei119 (Render 웹 서비스 이름)
# - NEMC_CACHE_TTL_SECONDS="180" & NEMC_REFRESH_INTERVAL_MS="180000" : 실시간 병상·공지·중증질환(Hot 데이터) 3분 주기 고속 갱신
# - NEMC_COLD_CACHE_TTL_SECONDS="21600" : 병원 주소·좌표·기본정보(Cold 데이터) 6시간 캐시 유지로 일일 트래픽 한도 절약
# - sync: false : 비밀키(NAVER_MAP_CLIENT_SECRET, NEMC_API_SERVICE_KEY)를 Git 저장소에 적지 않고 Render 대시보드 금고에서 안전하게 주입
