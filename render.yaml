services:
  - type: web
    name: yonsei119
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
      - key: NEMC_CACHE_TTL_SECONDS
        value: "60"
      - key: NEMC_COLD_CACHE_TTL_SECONDS
        value: "21600"
      - key: NEMC_REFRESH_INTERVAL_MS
        value: "60000"
      - key: NAVER_MAP_CLIENT_ID
        value: "xfbxloc8km"
      - key: NAVER_MAP_CLIENT_SECRET
        sync: false
      - key: NEMC_API_SERVICE_KEY
        sync: false

# ==============================================================================
# [역할 및 실행 시점]
# - 역할: Render 클라우드 배포 설계도 (식당 지점 오픈 매뉴얼 역할)
# - 실행 시점: GitHub 푸시로 Render 배포가 시작될 때 컨테이너 빌드·환경변수·헬스체크 규칙을 설정함
#
# [전체 호출 및 데이터 흐름]
# - 흐름:
#   GitHub 푸시 ──> Render가 render.yaml 읽기 ──> ./Dockerfile로 이미지 빌드
#   ├── envVars 주입 ──> application.yml(${...}) ──> Yonsei119Properties 레코드 바인딩
#   └── GET /api/health 주기 호출 (콜드스타트 화면 제어 핵심!)
#       ├── 초기 7종 공공데이터 캐시 적재 중: HTTP 503(WARMING_UP) ──> Render 기본 로딩 화면 유지
#       └── 캐시 적재 완료 직후: HTTP 200(UP) ──> Render 로딩 종료 후 즉시 병원 카드가 준비된 지도로 진입
#
# [내장 키 구분 및 설정값 요약]
# - Render Blueprint 내장 키: services, type(web), name, runtime(docker), plan(free), region, dockerfilePath, healthCheckPath, envVars, sync
# - 프로젝트 환경변수:
#   · NEMC_CACHE_TTL_SECONDS="60" / NEMC_REFRESH_INTERVAL_MS="60000" : 실시간 병상·응급메시지 60초 주기 동기화
#   · NEMC_COLD_CACHE_TTL_SECONDS="21600" : 병원 주소·좌표 등 마스터 데이터 6시간 캐시 유지
#   · sync: false : 비밀키(NAVER_MAP_CLIENT_SECRET, NEMC_API_SERVICE_KEY)를 Git에 올리지 않고 Render 대시보드에서 주입
#
# [사용처 및 IDE 추적 가이드]
# - 연결 코드: EmergencyApiController.health() (/api/health), EmergencyDataService.isReadyForTraffic(), application.yml
# - IntelliJ 전체 검색(`Ctrl + Shift + F`): `/api/health` 또는 `NEMC_REFRESH_INTERVAL_MS` 검색
# ==============================================================================
