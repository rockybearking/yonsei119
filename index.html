<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f8fc">
    <title>전국 응급의료기관 실시간 정보</title>
    <link rel="stylesheet" href="style.css">
    <script
            src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=64961e084dede515b221656f5fe6600c&amp;libraries=services&amp;autoload=false"
            defer
    ></script>
    <script src="app.js" defer></script>
</head>
<body>
<main id="map" aria-label="응급의료기관 지도"></main>

<header class="top-panel">
    <div class="brand">
        <span class="brand-icon">✚</span>
        <span>응급의료기관 찾기</span>
    </div>
    <p id="status" role="status" aria-live="polite">
        데이터를 불러오는 중입니다.
    </p>
    <p id="coordinates" class="coordinates" aria-live="polite">
        위치 확인 중 · 좌표를 기다리고 있습니다.
    </p>
    <div class="top-actions">
        <button id="location-button" type="button">◎ 내 위치</button>
        <button id="refresh-button" type="button">↻ 새로고침</button>
    </div>
</header>

<section class="search-panel" aria-label="병원 검색과 필터">
    <form id="search-form" autocomplete="off">
        <label class="sr-only" for="keyword">병원 이름</label>
        <input
                id="keyword"
                type="search"
                placeholder="병원 이름 검색"
                enterkeyhint="search"
        >
        <button type="submit">검색</button>
    </form>
    <ul
            id="search-results"
            class="search-results"
            aria-label="검색 결과"
            hidden
    ></ul>
    <div class="filters">
        <label>
            반경
            <select id="radius" aria-label="탐색 반경">
                <option value="5">5 km</option>
                <option value="10" selected>10 km</option>
                <option value="20">20 km</option>
                <option value="50">50 km</option>
                <option value="100">100 km</option>
                <option value="all">전국</option>
            </select>
        </label>
        <label>
            <input id="filter-tertiary" type="checkbox" checked>
            상급종합
        </label>
        <label>
            <input id="filter-medical" type="checkbox" checked>
            의료원
        </label>
        <label>
            <input id="filter-other" type="checkbox" checked>
            일반·기타
        </label>
    </div>
</section>

<div id="sheet-dim" class="sheet-dim" hidden></div>
<section
        id="sheet"
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="hospital-name"
        aria-hidden="true"
>
    <div
            id="sheet-drag-handle"
            class="sheet-drag-handle"
            aria-hidden="true"
    >
        <span></span>
    </div>
    <div class="sheet-header">
        <div>
            <p id="sheet-updated" class="sheet-updated"></p>
            <span id="hospital-type" class="type-badge"></span>
            <h1 id="hospital-name"></h1>
            <p id="hospital-address" class="muted"></p>
            <p id="hospital-distance" class="muted"></p>
        </div>
        <button
                id="sheet-close"
                class="close-button"
                type="button"
                aria-label="상세 정보 닫기"
        >×</button>
    </div>

    <div class="sheet-scroll">
        <p class="safety-note">
            정보에는 갱신 시차가 있습니다. 이송·방문 전에 병원에 수용 가능 여부를
            전화로 확인하세요.
        </p>
        <div id="contact-actions" class="contact-actions"></div>

        <section class="detail-section">
            <div class="section-heading">
                <h2>진료 공지</h2>
                <span id="message-count"></span>
            </div>
            <div id="messages" class="message-list"></div>
        </section>

        <section class="detail-section">
            <div class="section-heading">
                <h2>중증 응급질환 수용 현황</h2>
                <span id="severe-time"></span>
            </div>
            <div id="severe" class="severe-list"></div>
        </section>

        <section class="detail-section">
            <div class="section-heading">
                <h2>실시간 병상·수술실</h2>
                <span id="bed-time"></span>
            </div>
            <p class="section-help">
                대표 가용 수의 음수는 초과 수용으로 표기합니다. 세부 코드는 뜻을
                임의로 추정하지 않고 원본값을 보여줍니다.
            </p>
            <div id="key-beds" class="metric-grid"></div>
            <details class="raw-details">
                <summary>세부 병상·중환자실·시술 항목 전체 보기</summary>
                <div id="all-beds" class="raw-content"></div>
            </details>
        </section>

        <section class="detail-section">
            <div class="section-heading">
                <h2>가용 장비</h2>
            </div>
            <div id="equipment" class="equipment-grid"></div>
        </section>

        <section class="detail-section">
            <div class="section-heading">
                <h2>기관·외상센터 기본정보</h2>
            </div>
            <div id="basic-info" class="basic-info"></div>
        </section>

        <p id="data-state" class="data-state"></p>
    </div>
</section>
</body>
</html>
