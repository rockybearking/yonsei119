# ==============================================================================
# [1. 역할 및 실행 시점]
# - 역할 : 서버 포트·가상 스레드·60초 캐시 주기·외부 API 주소를 관리하는 중앙 설정표
# - 실행 시점 : 서버 시작 시 Spring Boot가 자동으로 읽어 `Yonsei119Properties`에 주입함
#
# [2. 전체 설정 주입 흐름 (시퀀스 다이어그램)]
#
#    [.env / OS Env]         [application.yml]        [Yonsei119Properties]      [Service / Filter]
#           |                        |                          |                         |
#           |-- 1. ${ENV:default} -->|                          |                         |  환경변수 우선 치환
#           |                        |-- 2. prefix=yonsei119 -->|                         |  불변 설정 레코드 바인딩
#           |                        |                          |-- 3. inject settings -->|  60초 캐시 · 포트 · 제한 적용
#           v                        v                          v                         v
#
# [3. 주요 설정 그룹 구분]
# - Spring Boot 표준 내장 설정
#   ㄴ spring.threads.virtual.enabled : Java 27 가상 스레드 활성화
#   ㄴ spring.config.import           : 로컬 `.env` 파일 선택적(`optional:`) 자동 로드
#   ㄴ server.port / compression      : 포트 바인딩 및 1KB 이상 GZIP 압축 전송
#   ㄴ management.endpoints           : Actuator 헬스·메트릭 노출
# - 프로젝트 커스텀 설정 (`yonsei119.*`)
#   ㄴ nemc.*            : NEMC 7대 OpenAPI 주소 · 서비스키 · 60초 실시간 캐시 주기
#   ㄴ naver.*           : 네이버 지도 공개 ID · 다크 스타일 · 서버 전용 시크릿 키
#   ㄴ default-origin    : 기본 출발 좌표 (서울시청)
#   ㄴ cors / rate-limit : 교차 출처 허용 패턴 · IP당 분당 60회 호출 제한
#
# [4. 실제 사용처 (연결 파일) 및 IDE 추적 가이드]
# - 연결 파일
#   ㄴ Yonsei119Properties.java : 모든 `yonsei119.*` 항목 1:1 바인딩 대상 레코드
#   ㄴ render.yaml              : 클라우드 환경변수 주입처
# - IntelliJ 추적 단축키
#   ㄴ 바인딩 필드로 이동 : YAML 키 위에서 `Ctrl + 좌클릭` (또는 `Ctrl + B`)
# ==============================================================================

spring:
  application:
    name: yonsei119
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 15s
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:application-local.yml
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:8080}
  http2:
    enabled: true
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/manifest+json
    min-response-size: 1024

yonsei119:
  nemc:
    base-url: ${NEMC_API_BASE_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService}
    service-key: ${NEMC_API_SERVICE_KEY:}
    cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:60}
    cold-cache-ttl-seconds: ${NEMC_COLD_CACHE_TTL_SECONDS:21600}
    request-timeout-ms: ${NEMC_REQUEST_TIMEOUT_MS:25000}
    auto-refresh-enabled: ${NEMC_AUTO_REFRESH_ENABLED:true}
    refresh-interval-ms: ${NEMC_REFRESH_INTERVAL_MS:60000}

  naver:
    # client-secret은 서버 내부 전용이며 /api/config 응답에는 절대 포함되지 않음
    client-id: ${NAVER_MAP_CLIENT_ID:xfbxloc8km}
    dark-style-id: ${NAVER_MAP_DARK_STYLE_ID:4b12b380-f70c-4d42-85df-ecf7961ff041}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}
    directions5-url: ${NAVER_DIRECTIONS5_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}
    directions15-url: ${NAVER_DIRECTIONS15_URL:https://maps.apigw.ntruss.com/map-direction-15/v1/driving}

  default-origin:
    lat: 37.5666805
    lng: 126.9784147
    label: 서울시청

  cors:
    allowed-origin-patterns: ${YONSEI119_CORS_ORIGINS:*}

  rate-limit:
    enabled: ${YONSEI119_RATE_LIMIT_ENABLED:true}
    capacity: ${YONSEI119_RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${YONSEI119_RATE_LIMIT_REFILL_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
