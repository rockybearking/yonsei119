spring:
  application:
    name: yonsei119-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:application-local.yml
  web:
    resources:
      cache:
        period: 0
# [스프링 내장 설정 키] spring.application.name, spring.config.import, spring.web.resources.cache.period (이름 변경 불가)
# [내가 지은 값] yonsei119-backend (서버 식별 이름), optional:file:.env[.properties] (로컬 .env 파일이 있으면 읽고 없어도 에러 없이 통과)
# [핵심 원리] 정적 파일 캐시 시간(period)을 0으로 두고 WebConfig의 ETag 재검증(304 Not Modified)과 결합하여,
# 프론트엔드 코드를 고치면 옛날 캐시에 묶이지 않고 즉시 최신 화면이 반영되면서도 전송량은 절약함.

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/xml,application/manifest+json
    min-response-size: 1024
# [스프링 내장 설정 키] server.port, server.compression.* (내장 Tomcat 포트 및 GZIP 압축 설정, 이름 변경 불가)
# [환경변수 치환 문법] ${PORT:8080} -> 운영체제에 PORT 환경변수가 있으면 그 값을 쓰고, 없으면 기본값 8080 포트로 엶.
# [성능 핵심 원리] 1KB(1024바이트) 이상인 JSON·JS·CSS·웹매니페스트 응답을 GZIP으로 압축해 모바일 초기 데이터 전송량을 약 75~85% 줄임.

yonsei119:
  nemc:
    base-url: ${NEMC_API_BASE_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService}
    service-key: ${NEMC_API_SERVICE_KEY:}
    cache-ttl-seconds: ${NEMC_CACHE_TTL_SECONDS:180}
    cold-cache-ttl-seconds: ${NEMC_COLD_CACHE_TTL_SECONDS:21600}
    request-timeout-ms: ${NEMC_REQUEST_TIMEOUT_MS:25000}
    auto-refresh-enabled: ${NEMC_AUTO_REFRESH_ENABLED:true}
    refresh-interval-ms: ${NEMC_REFRESH_INTERVAL_MS:180000}
  # [내가 지은 설정 계층] yonsei119.nemc.* -> config/Yonsei119Properties.java의 Nemc record로 1:1 자동 바인딩됨.
  #   (케밥 표기법 cache-ttl-seconds -> 자바 카멜 표기법 cacheTtlSeconds로 스프링이 자동 변환)
  # [Hot / Cold 이원화 아키텍처 핵심 원리]
  # - Hot 데이터 (실시간 병상·공지·28대 중증질환 3종 API): cache-ttl-seconds=180(3분), refresh-interval-ms=180000(3분마다 자동 갱신)
  # - Cold 데이터 (주소·좌표·기본정보·외상센터 마스터 4종 API): cold-cache-ttl-seconds=21600(6시간 유지)
  # -> 일일 공공데이터 트래픽 소모량은 줄이면서도 응급실 병상 실시간성은 기존(20분) 대비 약 7배 향상됨.

  naver:
    client-id: ${NAVER_MAP_CLIENT_ID:xfbxloc8km}
    dark-style-id: ${NAVER_MAP_DARK_STYLE_ID:4b12b380-f70c-4d42-85df-ecf7961ff041}
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}
    directions5-url: ${NAVER_DIRECTIONS5_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}
    directions15-url: ${NAVER_DIRECTIONS15_URL:https://maps.apigw.ntruss.com/map-direction-15/v1/driving}
  # [내가 지은 설정 계층] yonsei119.naver.* -> Yonsei119Properties.Naver record로 자동 주입됨.
  # [보안 핵심 원리]
  # - client-id, dark-style-id : 공개 설정 API(/api/config)를 통해 프론트엔드 지도 로더로 전달되어 단일 키로 통일 관리됨.
  # - client-secret : 오직 백엔드(NaverDirectionsService, NaverGeocodingService) 내부 서버 통신 헤더에만 실리며 브라우저로 절대 유출되지 않음.

  default-origin:
    lat: 37.5666805
    lng: 126.9784147
    label: 서울시청
  # [내가 지은 설정 계층] yonsei119.default-origin.* -> Yonsei119Properties.DefaultOrigin record로 주입됨.
  # [역할] GPS 신호가 없는 데스크톱 PC 환경이나 GPS 미수신·'초기화' 시 기준점으로 삼는 기본 좌표(서울시청)임.

  cors:
    allowed-origin-patterns: ${YONSEI119_CORS_ORIGINS:*}
  # [내가 지은 설정 계층] yonsei119.cors.allowed-origin-patterns -> WebConfig.java의 CORS 허용 출처 패턴으로 연결됨.
  # [역할] 개발 중에는 Live Server 등 다양한 로컬 포트를 허용(*)하고, 상용 폐쇄망 운영 시 환경변수로 특정 도메인만 제한할 수 있음.
