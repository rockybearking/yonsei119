plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}
/*
 * [Gradle 문법] plugins { id '...' version '...' } (빌드 엔진에 장착할 확장 플러그인 선언 블록)
 * [스프링/Gradle 내장 플러그인]
 * - 'java' : Java 소스(.java) 컴파일 및 JAR 패키징 기본 도구 (이름 변경 불가)
 * - 'org.springframework.boot' : 내장 톰캣 실행(bootRun)과 단일 실행 JAR(bootJar) 생성 도구
 * - 'io.spring.dependency-management' : 스프링 하위 라이브러리들의 호환 버전을 자동으로 맞춰주는 버전 관리자
 */

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
/*
 * [Gradle 내장 도구/함수] JavaLanguageVersion.of(17) (컴파일에 사용할 JDK 버전을 17로 고정, 이름 변경 불가)
 * [핵심 원리] 개발자 PC에 JDK 17, 21, 26 등 여러 버전이 깔려 있어도 자동으로 Java 17 컴파일러를 찾아 일관되게 빌드함.
 */

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
/*
 * [Gradle 내장 함수(의존성 범위)]
 * - implementation : 실제 서버 실행과 컴파일에 모두 필요한 핵심 라이브러리
 *   (형제 옵션: compileOnly, runtimeOnly, annotationProcessor, testImplementation, testRuntimeOnly)
 * [스프링/라이브러리 내장 패키지]
 * - 'spring-boot-starter-webmvc' : 내장 Tomcat 웹서버 + @RestController REST API + Jackson JSON 변환기 세트
 * - 'spring-boot-starter-test' & 'junit-platform-launcher' : JUnit 5 기반 자동화 통합 테스트 도구 세트
 */

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}
/*
 * [Gradle 내장 도구/함수] tasks.withType(JavaCompile).configureEach { ... }
 * [핵심 원리]
 * 1) options.encoding = 'UTF-8' : Windows 기본 인코딩(MS949) 환경에서도 한글 문자열·주석이 깨지지 않도록 UTF-8로 고정함.
 * 2) '-parameters' : 컴파일된 .class 파일 안에 함수 매개변수 이름을 보존하여 스프링 @RequestParam 바인딩 안정성을 높임.
 */

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
/*
 * [Gradle 내장 도구] Javadoc 문서 생성 시에도 한글 깨짐을 막기 위해 UTF-8 인코딩을 강제함.
 */

tasks.register('copyFrontendToStatic', Copy) {
    description = 'Copies frontend static modules (HTML, CSS, JS, PWA) into backend static resources.'
    from('../frontend') {
        exclude '**/.DS_Store', '**/Thumbs.db', 'Assets/**'
    }
    from('../frontend/Assets') {
        include '공공데이터포탈_logo.png'
        into 'Assets'
    }
    into layout.buildDirectory.dir('resources/main/static')
}
/*
 * [Gradle 내장 타입/함수] Copy, tasks.register(...), from(...), include(...), exclude(...), into(...)
 * [내가 지은 이름] 'copyFrontendToStatic' (프론트엔드 파일들을 백엔드 정적 폴더로 복사하는 작업 이름)
 * [핵심 원리 & 데이터 흐름 (도시락 합포장 비유)]
 * - ../frontend 폴더의 index.html, css/*, js/*, manifest.webmanifest, sw.js를
 *   backend/build/resources/main/static/ 안으로 자동 복사함.
 * - README 문서 전용 대용량 스크린샷(Assets/**)은 제외하고 파비콘·앱 아이콘(공공데이터포탈_logo.png)만 선별 포함해 배포 JAR 용량을 절약함.
 */

tasks.named('processResources') {
    dependsOn('copyFrontendToStatic')
}
/*
 * [Gradle 내장 함수] tasks.named('processResources'), dependsOn(...)
 * [핵심 원리] 스프링 리소스 묶기(processResources) 직전에 반드시 copyFrontendToStatic이 먼저 실행되도록 순서를 연결함.
 */

tasks.named('bootJar') {
    archiveFileName = 'yonsei119-backend.jar'
}
/*
 * [Gradle 내장 속성] archiveFileName (최종 생성될 실행 JAR 파일 이름 지정, 속성명 변경 불가)
 * [내가 지은 이름] 'yonsei119-backend.jar' (Dockerfile에서 복사해 실행하는 배포 파일명과 1:1 일치)
 */

tasks.named('jar') {
    enabled = false
}
/*
 * [핵심 원리] 라이브러리가 빠진 빈 껍데기 일반 JAR(*-plain.jar) 생성을 꺼서 배포 시 파일 혼동을 원천 차단함.
 */

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}
/*
 * [Gradle 내장 속성] workingDir = rootProject.projectDir
 * [핵심 원리] 로컬 개발 서버 실행 기준 위치를 모노레포 루트(yonsei119/)로 고정하여,
 * WebConfig.java의 'file:./frontend/' 경로가 실시간으로 프론트엔드 수정 사항을 즉시 읽어들일 수 있게 함.
 */

tasks.named('test') {
    useJUnitPlatform()
}
/*
 * [Gradle 내장 함수] useJUnitPlatform() (JUnit 5 테스트 엔진 활성화, 이름 변경 불가)
 */
