/*
 * [1. 역할 및 실행 시점]
 * - 역할 : Java 27 + Spring Boot 4.2 컴파일, 프론트엔드 정적 자산 병합,
 *          JUnit 5 · Playwright 테스트, 배포용 단일 `yonsei119.jar` 패키징 정의
 * - 실행 시점 : `:backend` 모듈 관련 Gradle 명령 실행 시 동작함
 *
 * [2. 전체 빌드 파이프라인 (시퀀스 다이어그램)]
 *
 *    [../frontend]        [copyFrontendToStatic]      [compileJava / test]         [bootJar]
 *          |                         |                          |                      |
 *          |-- 1. HTML/CSS/JS/SVG -->|                          |                      |  정적 파일 및 대학로고 수집
 *          |                         |-- 2. merge to static/ -->|                      |  클래스패스 정적 리소스 병합
 *          |                         |                          |-- 3. JDK 27 build -->|  검증 완료 후 yonsei119.jar 생성
 *          v                         v                          v                      v
 *
 * [3. 사용된 요소 구분 (표준 내장 / 플러그인 / 외부 라이브러리)]
 * - Gradle 표준 내장
 *   ㄴ id 'java'             : 컴파일 · 리소스 처리 · 테스트 기본 생명주기 제공
 *   ㄴ JavaLanguageVersion   : 호스트 환경과 무관하게 JDK 27 툴체인을 고정하는 클래스
 *   ㄴ Copy                  : 프론트엔드 정적 파일을 빌드 폴더로 복사하는 내장 태스크 타입
 *   ㄴ JavaCompile / Javadoc : UTF-8 인코딩 및 `-parameters` 컴파일 옵션 설정 타입
 * - Spring Boot 플러그인
 *   ㄴ org.springframework.boot (4.2.0)        : `bootRun`, `bootJar` 패키징 제공
 *   ㄴ io.spring.dependency-management (1.1.7) : 호환 라이브러리 버전 자동 정렬
 * - 외부 라이브러리 의존성
 *   ㄴ spring-boot-starter-webmvc   : 내장 Tomcat · Spring MVC · Jackson 3 JSON
 *   ㄴ spring-boot-starter-actuator : `/actuator/health`, `/actuator/metrics` 관측성
 *   ㄴ spring-boot-starter-test     : JUnit 5 · Spring Boot 통합 테스트 도구
 *   ㄴ playwright (1.65.1)          : 실제 Chromium 브라우저 E2E 자동 검증 도구
 *
 * [4. 실제 사용처 (연결 파일)]
 *   ㄴ Dockerfile     : `COPY --from=builder .../yonsei119.jar /app/app.jar`에서 참조
 *   ㄴ WebConfig.java : `classpath:/static/` 경로로 복사된 프론트엔드 파일을 서빙함
 */
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

springBoot {
    mainClass = 'com.yonsei119.Yonsei119Application'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.microsoft.playwright:playwright:1.65.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

/** 배포용 단일 JAR 안에서도 프론트엔드와 대학병원 로고가 서빙되도록 `static/`으로 동기화함 (삭제된 자산 자동 정리) */
tasks.register('copyFrontendToStatic', Sync) {
    description = 'Copies frontend static modules (HTML, CSS, JS, PWA, university logos) into backend static resources.'
    from('../frontend') {
        exclude '**/.DS_Store', '**/Thumbs.db', 'Assets/**'
    }
    from('../frontend/Assets') {
        include '공공데이터포탈_logo.png', 'universities/**'
        into 'Assets'
    }
    into layout.buildDirectory.dir('resources/main/static')
}

tasks.named('processResources') {
    dependsOn('copyFrontendToStatic')
}

tasks.named('bootJar') {
    archiveFileName = 'yonsei119.jar'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}
